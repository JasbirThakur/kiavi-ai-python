server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index dashboard.html;

    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Clean Routes Mapping
    location = / {
        try_files /dashboard.html =404;
    }

    location = /dashboard {
        try_files /dashboard.html =404;
    }

    location = /login {
        try_files /login.html =404;
    }

    location = /dashboard/account {
        try_files /account.html =404;
    }

    location = /account {
        try_files /account.html =404;
    }

    location = /test-site {
        try_files /test_site.html =404;
    }

    # Dynamic Widget URL: /widget/{public_key}
    location ~ ^/widget/([^/]+)$ {
        try_files /widget.html =404;
    }

    # Dynamic Live Agent Room: /live-chat/{conv_id}
    location ~ ^/live-chat/([^/]+)$ {
        try_files /live_chat.html =404;
    }


    # Embeddable script
    location = /w.js {
        try_files /w.js =404;
        add_header Content-Type application/javascript;
        add_header Access-Control-Allow-Origin *;
    }

    # Static Assets Proxy to Backend (preserves newly generated files & uploads)
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API Proxy with SSE Streaming Support
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time SSE streaming tokens
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Fallback for static assets
    location / {
        try_files $uri $uri/ /dashboard.html;
    }
}
