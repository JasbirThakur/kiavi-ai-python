<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
        @keyframes typewriterBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .typewriter-cursor { display: inline-block; color: #00c48c; font-weight: 700; margin-left: 2px; animation: typewriterBlink 0.8s infinite; }
    </style>
</head>
<body class="font-sans antialiased select-none">

    <div id="widgetContainer" class="w-full h-full relative flex flex-col justify-end items-end p-2 box-border transition-all duration-300">

        <!-- Proactive Smart Welcome Bubble -->
        <div id="wProactiveBubble" class="hidden mb-2 max-w-[260px] bg-slate-900 border border-cyan-500/40 text-white p-3 rounded-2xl shadow-2xl flex items-center justify-between gap-2 transition-all duration-300 transform scale-100 hover:scale-105 select-text">
            <div class="flex items-center gap-2 cursor-pointer" onclick="openChatFromBubble()">
                <span class="text-base animate-bounce">👋</span>
                <span id="wProactiveText" class="text-[11px] font-medium leading-snug text-slate-200">Have questions about our AI solutions? Ask me!</span>
            </div>
            <button onclick="dismissProactiveBubble(event)" class="text-slate-400 hover:text-white p-0.5 cursor-pointer"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
        </div>

        <!-- The Chat Window -->
        <div id="chatWindow" class="hidden bg-white w-[360px] h-[540px] rounded-3xl shadow-2xl flex-col overflow-hidden mb-3 border border-slate-200 relative">

            <!-- Header -->
            <div id="wHeader" class="p-3.5 text-white flex items-center justify-between" style="background-color: #00c48c;">
                <div class="flex items-center gap-2.5">
                    <div id="wAvatar" class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center font-bold text-sm shadow-inner">A</div>
                    <div>
                        <div id="wBotName" class="font-bold text-xs">Agent</div>
                        <div id="wBotStatus" class="text-[10px] text-white/80 flex items-center gap-1">
                            <span class="w-1.5 h-1.5 bg-emerald-300 rounded-full animate-pulse"></span> AI Assistant • Online
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-1.5">
                    <button id="wHumanBtn" onclick="requestLiveHuman()" title="Talk to Real Human / Agent" class="px-2.5 py-1 rounded-full bg-white/20 hover:bg-white/30 text-[10px] font-bold text-white flex items-center gap-1 transition cursor-pointer">
                        <i data-lucide="user-check" class="w-3 h-3"></i> Talk to Human
                    </button>
                    <button onclick="toggleChat()" class="text-white hover:text-white/80 p-1 cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>

            </div>

            <!-- Chat Body -->
            <div id="wChatBody" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50 text-xs relative select-text">
                <div class="bg-white border border-slate-100 p-3 rounded-2xl max-w-[88%] text-slate-700 shadow-sm" id="wGreeting">
                    Hi! How can I help you today?
                </div>
                <div id="wSuggestions" class="flex flex-col items-end gap-1.5 pt-1"></div>
            </div>

            <!-- Evidence Inspector Drawer / Modal -->
            <div id="evidenceModal" class="hidden absolute inset-0 z-40 bg-black/70 backdrop-blur-xs flex flex-col justify-end p-3 transition-all">
                <div class="bg-slate-900 border border-cyan-500/40 rounded-2xl p-4 text-white shadow-2xl space-y-2 max-h-[85%] flex flex-col">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                        <div class="flex items-center gap-1.5 text-xs font-bold text-cyan-400">
                            <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Grounded Source Verification
                        </div>
                        <button onclick="closeEvidence()" class="text-slate-400 hover:text-white cursor-pointer"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                    </div>
                    <div id="evidenceTitle" class="text-xs font-bold text-slate-100 truncate"></div>
                    <div id="evidenceSnippet" class="text-[11px] text-slate-300 bg-slate-950 p-2.5 rounded-xl border border-slate-800/80 overflow-y-auto max-h-[200px] leading-relaxed font-mono select-text"></div>
                    <div class="text-[9px] text-slate-500 text-right">Extracted verbatim from verified knowledge base</div>
                </div>
            </div>

            <!-- PDF Viewer Drawer / Modal (Widget) -->
            <div id="widgetPdfModal" class="hidden absolute inset-0 z-40 bg-black/80 backdrop-blur-xs flex flex-col justify-end p-2 transition-all">
                <div class="bg-slate-900 border border-cyan-500/40 rounded-2xl text-white shadow-2xl h-[92%] flex flex-col overflow-hidden">
                    <div class="flex items-center justify-between border-b border-slate-800 px-3 py-2 bg-slate-950/90 shrink-0">
                        <div class="flex items-center gap-2 min-w-0">
                            <div class="w-6 h-6 rounded-lg bg-red-500/20 border border-red-500/40 flex items-center justify-center shrink-0 text-red-400">
                                <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
                            </div>
                            <div class="min-w-0">
                                <div id="widgetPdfTitle" class="text-[11px] font-bold text-white truncate">Product Specifications</div>
                                <div class="text-[9px] text-cyan-400 font-mono">Official Certified PDF</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <a id="widgetPdfNewTab" href="#" target="_blank" rel="noopener noreferrer" title="Open in new tab" class="p-1 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition">
                                <i data-lucide="external-link" class="w-3.5 h-3.5 text-cyan-400"></i>
                            </a>
                            <a id="widgetPdfDownload" href="#" download title="Download PDF" class="p-1 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition">
                                <i data-lucide="download" class="w-3.5 h-3.5 text-emerald-400"></i>
                            </a>
                            <button onclick="closeWidgetPdf()" class="p-1 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition cursor-pointer">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                    <div class="flex-1 w-full bg-slate-950 relative">
                        <iframe id="widgetPdfFrame" src="" class="w-full h-full border-0" title="PDF Document Viewer"></iframe>
                    </div>
                </div>
            </div>

            <!-- Input Area with Voice AI Mic -->
            <div class="p-3 bg-white border-t border-slate-100">
                <div class="flex items-center gap-1.5">
                    <input id="wInput" type="text" placeholder="Type or click mic to speak..." class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-700 outline-none focus:border-slate-400" onkeydown="if(event.key==='Enter') sendMessage()" />
                    <button id="wMicBtn" onclick="toggleVoiceInput()" title="Voice Input" class="p-2 rounded-xl bg-slate-100 text-slate-500 hover:text-cyan-600 transition cursor-pointer">
                        <i id="wMicIcon" data-lucide="mic" class="w-4 h-4"></i>
                    </button>
                    <button id="wSendBtn" onclick="sendMessage()" class="p-2 rounded-xl text-white transition cursor-pointer" style="background-color: #00c48c;">
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Floating Launcher Button -->
        <button id="wLauncher" onclick="toggleChat()" class="w-14 h-14 rounded-full flex items-center justify-center text-white shadow-2xl hover:scale-105 transition cursor-pointer relative" style="background-color: #00c48c;">
            <i id="wLauncherIcon" data-lucide="message-square" class="w-6 h-6"></i>
        </button>

    </div>

    <script>
        const publicKey = window.location.pathname.split('/').pop();
        let botConfig = null;
        let isOpen = false;
        let currentConvId = null;
        let pollTimer = null;
        let isHumanHandedOff = false;

        function formatTime() {
            const d = new Date();
            let h = d.getHours();
            const m = d.getMinutes().toString().padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return `${h}:${m} ${ampm}`;
        }

        function formatMarkdownWithImages(text) {
            if (!text) return "";
            // 1. In-Chat Diagram / Image rendering ![Alt](url)
            let html = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (match, alt, url) => {
                const label = alt || 'Visual Architecture / Diagram';
                return `
                    <div class="my-2.5 rounded-2xl overflow-hidden border border-cyan-500/30 shadow-lg bg-[#060b17] p-2.5 text-center">
                        <a href="${url}" target="_blank" title="Click to view diagram in high-resolution">
                            <img src="${url}" alt="${label}" class="w-full h-auto rounded-xl object-contain max-h-[260px] hover:scale-[1.02] transition mx-auto" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');" />
                            <div class="hidden py-4 px-3 flex flex-col items-center justify-center text-cyan-400 bg-blue-950/40 rounded-xl border border-cyan-500/20">
                                <i data-lucide="image" class="w-5 h-5 mb-1 text-cyan-400"></i>
                                <span class="font-medium text-xs text-slate-200">${label}</span>
                                <span class="text-[10px] text-cyan-400 font-mono mt-0.5">Click to open source image ↗</span>
                            </div>
                        </a>
                        <div class="text-[11px] text-slate-400 font-mono text-center pt-2 flex items-center justify-center gap-1.5"><i data-lucide="eye" class="w-3 h-3 text-cyan-400"></i> ${label}</div>
                    </div>
                `;
            });
            // 2. Flowchart / Preformatted Code Blocks ```...```
            html = html.replace(/```([\s\S]*?)```/g, '<pre class="bg-[#040814] p-3 rounded-xl border border-blue-500/30 text-cyan-300 font-mono text-[11px] overflow-x-auto my-2 leading-relaxed">$1</pre>');
            // 3. Inline code `...`
            html = html.replace(/`([^`]+)`/g, '<code class="bg-blue-950/60 text-cyan-300 px-1.5 py-0.5 rounded text-[11px] font-mono border border-blue-500/30">$1</code>');
            // 4a. Official PDF Action Card [PDF_CARD:topic|Title]
            html = html.replace(/\[PDF_CARD:([^\|\]]+)\|([^\]]+)\]/g, (match, topic, title) => {
                const cleanTopic = (topic || "product-catalogue").trim();
                const cleanTitle = (title || "Product Specifications & Catalogue").trim();
                const escapedTitle = cleanTitle.replace(/'/g, "\\'");
                const botId = (botConfig && botConfig.botId) ? botConfig.botId : "";
                const downloadUrl = `/api/catalogues/pdf?bot_id=${encodeURIComponent(botId)}&topic=${encodeURIComponent(cleanTopic)}&title=${encodeURIComponent(cleanTitle)}&download=1`;
                return `
                    <div class="my-2.5 p-3 rounded-2xl bg-gradient-to-r from-slate-900 to-blue-950/90 border border-cyan-500/40 shadow-md text-white space-y-2.5">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <div class="w-8 h-8 rounded-xl bg-red-500/20 border border-red-500/40 flex items-center justify-center shrink-0 text-red-400">
                                <i data-lucide="file-text" class="w-4 h-4"></i>
                            </div>
                            <div class="min-w-0 flex-1">
                                <div class="text-[11px] font-bold text-white truncate flex items-center gap-1.5">
                                    <span class="truncate">${cleanTitle}</span>
                                    <span class="px-1 py-0.2 rounded text-[8px] bg-red-500/20 text-red-300 font-mono border border-red-500/30 shrink-0 font-semibold">PDF SPEC</span>
                                </div>
                                <div class="text-[9px] text-cyan-300 font-mono truncate">Official Certified Documentation</div>
                            </div>
                        </div>
                        <div class="flex items-center justify-end gap-2 pt-1 border-t border-slate-800/80">
                            <button type="button" onclick="openWidgetPdf('${cleanTopic}', '${escapedTitle}')" class="px-2.5 py-1.2 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/40 text-[10px] font-semibold flex items-center gap-1 transition cursor-pointer">
                                <i data-lucide="eye" class="w-3 h-3"></i>
                                <span>View PDF</span>
                            </button>
                            <a href="${downloadUrl}" download="${cleanTopic}-catalogue.pdf" class="px-2.5 py-1.2 rounded-lg text-black text-[10px] font-bold flex items-center gap-1 shadow-sm transition cursor-pointer" style="background-color: ${botConfig ? botConfig.accentColor : '#00c48c'};">
                                <i data-lucide="download" class="w-3 h-3"></i>
                                <span>Download PDF</span>
                            </a>
                        </div>
                    </div>
                `;
            });
            // 4b. Interactive PDF Document Card
            html = html.replace(/\[([^\]]*?(?:PDF|Catalogue|Catalog|Document|Download|Sheet)[^\]]*?)\]\s*\(((?:https?:\/\/|\/)[^\s)]+\.pdf(?:\?[^\s)]*)?)\)/gi, (match, title, url) => {
                const cleanTitle = title.replace(/^[📄📑📁\s]+/, '').trim() || "Official Product Catalogue (PDF)";
                const escapedTitle = cleanTitle.replace(/'/g, "\\'");
                return `
                    <div class="my-2.5 p-2.5 rounded-2xl bg-slate-900 border border-cyan-500/40 shadow-md flex items-center justify-between gap-2 text-white">
                        <div class="flex items-center gap-2 min-w-0">
                            <div class="w-8 h-8 rounded-xl bg-red-500/20 border border-red-500/40 flex items-center justify-center shrink-0 text-red-400">
                                <i data-lucide="file-text" class="w-4 h-4"></i>
                            </div>
                            <div class="truncate">
                                <div class="text-[11px] font-bold text-white truncate">${cleanTitle}</div>
                                <div class="text-[9px] text-cyan-300 font-mono">Official PDF Document</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <button type="button" onclick="openWidgetPdf('${url}', '${escapedTitle}')" class="px-2 py-1 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/30 text-[10px] font-semibold flex items-center gap-1 transition cursor-pointer">
                                <i data-lucide="eye" class="w-3 h-3"></i>
                                <span>View</span>
                            </button>
                            <a href="${url}" download class="px-2.5 py-1 rounded-lg text-black text-[10px] font-bold flex items-center gap-1 shadow-sm transition" style="background-color: ${botConfig ? botConfig.accentColor : '#00c48c'};">
                                <i data-lucide="download" class="w-3 h-3"></i>
                                <span>Get</span>
                            </a>
                        </div>
                    </div>
                `;
            });
            // 4c. Markdown Links [Text](URL) or [Text] (URL) with optional space
            html = html.replace(/\[([^\]]+)\]\s*\(((?:https?:\/\/|\/)[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" class="text-blue-600 dark:text-cyan-400 font-bold underline hover:opacity-80 inline-flex items-center gap-0.5">$1 ↗</a>');
            // 5. Raw URLs that are not part of an existing href tag
            html = html.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer" class="text-blue-600 dark:text-cyan-400 font-semibold underline break-all hover:opacity-80">$2</a>');
            // 6. Bold text
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            // 7. Bullet points (-, *, •)
            html = html.replace(/^\s*[\-\*•]\s+(.+)$/gm, '<li class="ml-3 my-0.5">$1</li>');
            // 8. Line breaks
            html = html.replace(/\n/g, '<br/>');
            return html;
        }

        async function init() {
            lucide.createIcons();
            try {
                const res = await fetch(`/api/public/config/${publicKey}`);
                if (!res.ok) return;
                botConfig = await res.json();

                // 1. Notify parent iframe of docking position (left vs right)
                const pos = botConfig.launcherPosition || 'right';
                window.parent.postMessage({ type: 'position', pos: pos }, '*');

                const container = document.getElementById('widgetContainer');
                if (pos === 'left') {
                    container.classList.remove('items-end');
                    container.classList.add('items-start');
                } else {
                    container.classList.remove('items-start');
                    container.classList.add('items-end');
                }

                // 2. Dynamic Colors
                const color = botConfig.accentColor || '#00c48c';
                document.getElementById('wHeader').style.backgroundColor = color;
                document.getElementById('wHeader').style.boxShadow = `0 4px 20px ${color}33`;
                document.getElementById('wSendBtn').style.backgroundColor = color;
                document.getElementById('wLauncher').style.backgroundColor = color;
                document.getElementById('wLauncher').style.boxShadow = `0 8px 30px ${color}66`;

                // 3. Name, Avatar & Logo
                document.getElementById('wBotName').innerText = botConfig.name || 'Agent';
                const avatarEl = document.getElementById('wAvatar');
                if (botConfig.logoUrl && !botConfig.logoUrl.includes('placeholder')) {
                    avatarEl.innerHTML = `<img src="${botConfig.logoUrl}" class="w-full h-full rounded-full object-cover" onerror="this.parentElement.innerText='${(botConfig.name || 'A').charAt(0).toUpperCase()}'" />`;
                } else {
                    avatarEl.innerText = (botConfig.name || 'A').charAt(0).toUpperCase();
                }

                // 4. Dynamic Typewriter Greeting
                const bName = botConfig.name || 'Kiavi IQ';
                let bDomain = 'our official products & services';
                if (botConfig.domain) {
                    bDomain = botConfig.domain.replace(/^https?:\/\//, '').replace(/^www\./, '').split('/')[0];
                }
                const dynamicGreeting = `👋 Hey there! Welcome to ${bName}! 🚀 I'm your dedicated AI partner for ${bDomain}—ready to help you explore solutions, technical specs, pricing, and live support. What can I help you with today?`;
                runWidgetTypewriter('wGreeting', dynamicGreeting, 18);

                // 5. Template Theming (Midnight Theme Support)
                if (botConfig.template === 'midnight') {
                    const chatWin = document.getElementById('chatWindow');
                    chatWin.className = "hidden bg-[#05070c] w-[360px] h-[540px] rounded-3xl shadow-2xl flex-col overflow-hidden mb-3 border border-slate-800 text-white";
                    chatWin.style.boxShadow = `0 0 40px ${color}25`;
                    document.getElementById('wChatBody').className = "flex-1 p-4 overflow-y-auto space-y-3 bg-[#020617] text-xs select-text";
                    document.getElementById('wGreeting').className = "bg-[#0b0f19] border border-slate-800 p-3 rounded-2xl max-w-[88%] text-slate-100 shadow-sm";
                    document.getElementById('wInput').parentElement.parentElement.className = "p-3 bg-[#05070c] border-t border-slate-800";
                    document.getElementById('wInput').className = "flex-1 bg-[#0b0f19] border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-slate-600";
                }

                // 6. Suggestions
                const defaultSuggestions = (botConfig.suggestions && botConfig.suggestions.length > 0)
                    ? botConfig.suggestions
                    : ["Explore Product Catalogue 📁", "Company Services & Products", "Pricing & Details", "Official Address & Contact"];
                const isDark = botConfig.template === 'midnight';
                const btnClass = isDark
                    ? "bg-[#0b0f19] hover:bg-[#111827] border border-slate-800 px-3 py-1.5 rounded-full text-[11px] text-slate-200 shadow-sm transition cursor-pointer"
                    : "bg-white hover:bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-full text-[11px] text-slate-600 shadow-sm transition cursor-pointer";
                document.getElementById('wSuggestions').innerHTML = defaultSuggestions.map(s => `
                    <button onclick="sendSuggestion('${s.replace(/'/g, "\\'")}')" class="${btnClass}">${s}</button>
                `).join('');

                // 7. Trigger Smart Welcome Bubble after 5 seconds
                setTimeout(() => {
                    if (!isOpen) {
                        const bubble = document.getElementById('wProactiveBubble');
                        if (bubble && bubble.classList.contains('hidden')) {
                            bubble.classList.remove('hidden');
                            window.parent.postMessage({ type: 'resize', width: '300px', height: '160px' }, '*');
                        }
                    }
                }, 5000);

            } catch(e) {}
        }

        function openChatFromBubble() {
            dismissProactiveBubble();
            toggleChat();
        }

        function dismissProactiveBubble(e) {
            if (e) e.stopPropagation();
            const bubble = document.getElementById('wProactiveBubble');
            if (bubble) bubble.classList.add('hidden');
            if (!isOpen) {
                window.parent.postMessage({ type: 'resize', width: '80px', height: '80px' }, '*');
            }
        }

        function toggleChat() {
            isOpen = !isOpen;
            dismissProactiveBubble();
            const chatWindow = document.getElementById('chatWindow');
            if (isOpen) {
                chatWindow.classList.remove('hidden');
                chatWindow.classList.add('flex');
                document.getElementById('wLauncherIcon').setAttribute('data-lucide', 'x');
                window.parent.postMessage({ type: 'resize', width: '390px', height: '640px' }, '*');
            } else {
                chatWindow.classList.add('hidden');
                chatWindow.classList.remove('flex');
                document.getElementById('wLauncherIcon').setAttribute('data-lucide', 'message-square');
                window.parent.postMessage({ type: 'resize', width: '80px', height: '80px' }, '*');
            }
            lucide.createIcons();
        }

        function runWidgetTypewriter(elementId, fullText, speed = 18) {
            const el = document.getElementById(elementId);
            if (!el) return;
            el.innerHTML = '<span class="tw-txt"></span><span class="typewriter-cursor">|</span>';
            const spanTxt = el.querySelector('.tw-txt');
            const cursor = el.querySelector('.typewriter-cursor');
            let idx = 0;
            const timer = setInterval(() => {
                if (idx < fullText.length) {
                    spanTxt.textContent += fullText.charAt(idx);
                    idx++;
                } else {
                    clearInterval(timer);
                    if (cursor) cursor.remove();
                    el.innerHTML = formatMarkdownWithImages(fullText);
                    lucide.createIcons();
                }
            }, speed);
        }

        function sendSuggestion(s) {
            document.getElementById('wInput').value = s;
            sendMessage();
        }

        let recognition = null;
        let isListening = false;
        let wMediaRecorder = null;
        let wAudioChunks = [];
        let wMediaStream = null;

        async function toggleVoiceInput() {
            const micBtn = document.getElementById('wMicBtn');
            const input = document.getElementById('wInput');

            if (isListening) {
                if (recognition) {
                    try { recognition.stop(); } catch(e) {}
                }
                if (wMediaRecorder && wMediaRecorder.state === 'recording') {
                    try { wMediaRecorder.stop(); } catch(e) {}
                }
                isListening = false;
                if (micBtn) micBtn.classList.remove('bg-red-500/20', 'text-red-500', 'animate-pulse');
                if (input) input.placeholder = "Type or click mic to speak...";
                return;
            }

            // Engine 1: Web Speech API (Chrome / Edge / Safari)
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            const isFirefox = navigator.userAgent.toLowerCase().includes('firefox');

            if (SpeechRec && !isFirefox) {
                try {
                    if (!recognition) {
                        recognition = new SpeechRec();
                        recognition.continuous = false;
                        recognition.interimResults = false;
                        recognition.lang = 'en-US';

                        recognition.onstart = () => {
                            isListening = true;
                            if (micBtn) micBtn.classList.add('bg-red-500/20', 'text-red-500', 'animate-pulse');
                            if (input) input.placeholder = "🎙️ Listening... (Speak now)";
                        };

                        recognition.onresult = (event) => {
                            const speechResult = event.results[0][0].transcript;
                            if (speechResult) {
                                if (input) input.value = speechResult;
                                sendMessage();
                            }
                        };

                        recognition.onend = () => {
                            isListening = false;
                            if (micBtn) micBtn.classList.remove('bg-red-500/20', 'text-red-500', 'animate-pulse');
                            if (input) input.placeholder = "Type or click mic to speak...";
                        };

                        recognition.onerror = (err) => {
                            console.warn("Native SpeechRecognition error, fallback to audio recorder", err);
                            isListening = false;
                            if (micBtn) micBtn.classList.remove('bg-red-500/20', 'text-red-500', 'animate-pulse');
                            if (input) input.placeholder = "Type or click mic to speak...";
                            if (err.error !== 'not-allowed') {
                                startMediaRecorderWidgetVoice();
                            }
                        };
                    }
                    recognition.start();
                    return;
                } catch(e) {
                    console.warn("Could not start Web Speech, fallback to server transcribe", e);
                }
            }

            // Engine 2: MediaRecorder + Server Transcribe (Firefox, Linux, Mobile fallback)
            startMediaRecorderWidgetVoice();
        }

        async function startMediaRecorderWidgetVoice() {
            const micBtn = document.getElementById('wMicBtn');
            const input = document.getElementById('wInput');

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("Microphone recording is not supported in this browser.");
                return;
            }

            try {
                wMediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                wAudioChunks = [];

                let mimeType = 'audio/webm';
                if (window.MediaRecorder) {
                    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                        mimeType = 'audio/webm;codecs=opus';
                    } else if (MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')) {
                        mimeType = 'audio/ogg;codecs=opus';
                    } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
                        mimeType = 'audio/mp4';
                    }
                }

                wMediaRecorder = new MediaRecorder(wMediaStream, mimeType ? { mimeType } : undefined);

                wMediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) {
                        wAudioChunks.push(e.data);
                    }
                };

                wMediaRecorder.onstart = () => {
                    isListening = true;
                    if (micBtn) micBtn.classList.add('bg-red-500/20', 'text-red-500', 'animate-pulse');
                    if (input) input.placeholder = "🎙️ Listening... (Click mic when done)";
                };

                wMediaRecorder.onstop = async () => {
                    isListening = false;
                    if (micBtn) micBtn.classList.remove('bg-red-500/20', 'text-red-500', 'animate-pulse');
                    if (input) input.placeholder = "⚡ Transcribing speech...";

                    if (wMediaStream) {
                        wMediaStream.getTracks().forEach(track => track.stop());
                        wMediaStream = null;
                    }

                    if (wAudioChunks.length === 0) {
                        if (input) input.placeholder = "Type or click mic to speak...";
                        return;
                    }

                    const audioBlob = new Blob(wAudioChunks, { type: mimeType || 'audio/webm' });
                    const form = new FormData();
                    form.append('file', audioBlob, 'speech.webm');

                    try {
                        const res = await fetch('/api/voice/transcribe', {
                            method: 'POST',
                            body: form
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (data.text) {
                                if (input) {
                                    input.value = data.text;
                                    input.placeholder = "Type or click mic to speak...";
                                }
                                sendMessage();
                            } else {
                                if (input) input.placeholder = "No speech detected. Try again.";
                            }
                        } else {
                            if (input) input.placeholder = "Speech transcription error. Try again.";
                        }
                    } catch(err) {
                        if (input) input.placeholder = "Voice connection error.";
                    }

                    setTimeout(() => {
                        if (input && input.placeholder !== "Type or click mic to speak...") {
                            input.placeholder = "Type or click mic to speak...";
                        }
                    }, 3500);
                };

                wMediaRecorder.start();

            } catch(err) {
                console.error("Mic access error:", err);
                isListening = false;
                if (micBtn) micBtn.classList.remove('bg-red-500/20', 'text-red-500', 'animate-pulse');
                if (input) input.placeholder = "Type or click mic to speak...";
                alert("Microphone permission was denied or not available.");
            }
        }

        function speakText(btn, rawText) {
            if (!('speechSynthesis' in window)) return;
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                btn.innerHTML = '<i data-lucide="volume-2" class="w-3.5 h-3.5"></i>';
                lucide.createIcons();
                return;
            }

            // Clean markdown syntax, URLs, brackets for natural human speech output
            let cleanText = (rawText || "")
                .replace(/https?:\/\/[^\s)]+/g, '')
                .replace(/\/static\/[^\s)]+/g, '')
                .replace(/[📄📑📁⚡•\*\#\`\_\[\]\(\)]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

            if (!cleanText) return;

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.lang = 'en-US';

            utterance.onstart = () => {
                btn.innerHTML = '<i data-lucide="volume-x" class="w-3.5 h-3.5 text-cyan-400 animate-pulse"></i>';
                lucide.createIcons();
            };

            utterance.onend = utterance.onerror = () => {
                btn.innerHTML = '<i data-lucide="volume-2" class="w-3.5 h-3.5"></i>';
                lucide.createIcons();
            };

            window.speechSynthesis.speak(utterance);
        }

        let lastUserQuestion = "";

        async function sendMessage() {
            const input = document.getElementById('wInput');
            const q = input.value.trim();
            if (!q || !botConfig) return;
            lastUserQuestion = q;
            input.value = "";

            const body = document.getElementById('wChatBody');
            const timeStr = formatTime();

            body.innerHTML += `
                <div class="flex flex-col items-end">
                    <span class="text-white px-3.5 py-2 rounded-2xl inline-block shadow-sm" style="background-color: ${botConfig.accentColor}">${q}</span>
                    <span class="text-[9px] text-slate-400 mt-0.5 mr-1 font-mono">${timeStr}</span>
                </div>
            `;

            const msgId = 'wmsg_' + Date.now();
            const isDark = botConfig.template === 'midnight';
            const botBubbleClass = isDark
                ? "bg-[#0b0f19] border border-slate-800 p-3.5 rounded-2xl inline-block max-w-[88%] text-slate-100 shadow-sm leading-relaxed"
                : "bg-white border border-slate-100 p-3.5 rounded-2xl inline-block max-w-[88%] text-slate-700 shadow-sm leading-relaxed";

            body.innerHTML += `
                <div class="flex flex-col items-start space-y-1">
                    <div class="flex items-start gap-1.5 w-full">
                        <span id="${msgId}" class="${botBubbleClass}">
                            <span class="inline-flex items-center gap-1.5 py-0.5 text-cyan-500">
                                <span class="w-2 h-2 rounded-full bg-cyan-500 animate-bounce" style="animation-delay: 0ms"></span>
                                <span class="w-2 h-2 rounded-full bg-cyan-500 animate-bounce" style="animation-delay: 150ms"></span>
                                <span class="w-2 h-2 rounded-full bg-cyan-500 animate-bounce" style="animation-delay: 300ms"></span>
                            </span>
                        </span>
                        <button id="${msgId}_tts" onclick="speakText(this, document.getElementById('${msgId}').innerText)" class="mt-1 text-slate-400 hover:text-cyan-400 p-1 rounded-lg transition" title="Read Aloud">
                            <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                    <div id="${msgId}_sources" class="w-full"></div>
                    <div id="${msgId}_followup" class="w-full"></div>
                    <div id="${msgId}_lead"></div>
                    <span class="text-[9px] text-slate-400 ml-1 font-mono">${timeStr}</span>
                </div>
            `;
            lucide.createIcons();
            body.scrollTo({ top: body.scrollHeight, behavior: 'smooth' });

            // Check if user specifically asks for human
            const qLower = q.toLowerCase();
            if (qLower.includes("human") || qLower.includes("agent") || qLower.includes("connect me") || qLower.includes("talk to person")) {
                requestLiveHuman();
            }

            const form = new FormData();
            form.append('bot_id', botConfig.botId);
            form.append('question', q);
            const savedVisitorName = localStorage.getItem('kiavi_visitor_name');
            if (savedVisitorName) {
                form.append('user_name', savedVisitorName);
            }

            const res = await fetch('/api/public/chat/stream', { method: 'POST', body: form });
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            const target = document.getElementById(msgId);
            let fullText = "";
            let receivedFirstToken = false;

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                const lines = decoder.decode(value).split('\n');
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.replace('data: ', ''));
                            if (data.type === 'token') {
                                if (!receivedFirstToken) {
                                    target.innerHTML = "";
                                    receivedFirstToken = true;
                                }
                                fullText += data.content;
                                target.innerHTML = formatMarkdownWithImages(fullText);
                                body.scrollTo({ top: body.scrollHeight, behavior: 'smooth' });
                            } else if (data.type === 'sources' && data.sources && data.sources.length > 0) {
                                document.getElementById(msgId + '_sources').innerHTML = `
                                    <div class="flex flex-wrap gap-1.5 mt-1 pt-1">
                                        ${data.sources.map(s => `
                                            <button onclick="showEvidence('${s.title.replace(/'/g, "\\'")}', '${s.snippet.replace(/'/g, "\\'").replace(/\n/g, " ")}')" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-cyan-500/10 hover:bg-cyan-500/25 text-cyan-600 dark:text-cyan-400 border border-cyan-500/20 text-[10px] font-medium transition cursor-pointer">
                                                <i data-lucide="file-check" class="w-2.5 h-2.5"></i>
                                                <span>${s.title.length > 20 ? s.title.substring(0, 18) + '...' : s.title}</span>
                                            </button>
                                        `).join('')}
                                    </div>
                                `;
                                lucide.createIcons();
                                body.scrollTop = body.scrollHeight;
                            } else if (data.type === 'followup' && data.prompt && data.options) {
                                const followupContainer = document.getElementById(msgId + '_followup');
                                if (followupContainer) {
                                    renderWidgetFollowup(followupContainer, data, msgId);
                                    body.scrollTo({ top: body.scrollHeight, behavior: 'smooth' });
                                }
                            } else if (data.type === 'lead_form') {
                                document.getElementById(msgId + '_lead').innerHTML = `
                                    <div class="mt-2 p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl space-y-2 max-w-[88%] shadow-md">
                                        <div class="font-bold text-slate-700 dark:text-slate-200 text-[11px]">Leave your details:</div>
                                        <input id="l_name" placeholder="Your Name" class="w-full bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 p-1.5 rounded-lg text-xs outline-none text-slate-800 dark:text-white" />
                                        <input id="l_email" placeholder="Email or Phone Number" class="w-full bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 p-1.5 rounded-lg text-xs outline-none text-slate-800 dark:text-white" />
                                        <button onclick="submitLead('${botConfig.botId}', this)" class="w-full text-white font-bold p-1.5 rounded-lg text-xs transition cursor-pointer" style="background-color: ${botConfig.accentColor}">Submit</button>
                                    </div>
                                `;
                                body.scrollTop = body.scrollHeight;
                            } else if (data.type === 'done') {
                                if (!fullText.trim()) {
                                    fullText = (data.full_text && data.full_text.trim()) ? data.full_text : "Here are the verified details from the knowledge base:";
                                    target.innerHTML = formatMarkdownWithImages(fullText);
                                    body.scrollTo({ top: body.scrollHeight, behavior: 'smooth' });
                                }
                            }
                        } catch(e) {}
                    }
                }
            }
        }

                            </button>
                        </div>

                        <div id="${expandId}_grid" class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto pr-1">
                            ${more.map(opt => `
                                <button type="button" 
                                        data-topic="${opt.toLowerCase()}"
                                        onclick="handleWidgetFollowup(this, '${opt.replace(/'/g, "\\'")}', '${promptText.replace(/'/g, "\\'")}')" 
                                        class="widget-followup-pill widget-followup-btn px-2 py-0.5 rounded-lg text-[10.5px] font-medium border border-cyan-500/25 text-cyan-800 dark:text-cyan-200 bg-cyan-500/10 hover:bg-cyan-500/25 active:scale-95 transition cursor-pointer flex items-center gap-1">
                                    <span>${opt}</span>
                                    <i data-lucide="arrow-right" class="w-2.5 h-2.5 opacity-60"></i>
                                </button>
                            `).join('')}
                        </div>

                        <div id="${expandId}_empty" class="hidden text-center py-2 text-[10px] text-slate-400 italic">
                            No matching topics found.
                        </div>

                        <div class="flex justify-end pt-1 border-t border-cyan-500/20">
                            <button type="button" onclick="toggleWidgetFollowupExpand('${expandId}')" class="text-[10px] text-cyan-600 dark:text-cyan-400 hover:underline flex items-center gap-0.5 cursor-pointer">
                                <span>Show less</span>
                                <i data-lucide="chevron-up" class="w-2.5 h-2.5"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function toggleWidgetFollowupExpand(expandId) {
            const panel = document.getElementById(expandId + '_panel');
            const txt = document.getElementById(expandId + '_toggle_txt');
            if (!panel) return;
            const isHidden = panel.classList.contains('hidden');
            if (isHidden) {
                panel.classList.remove('hidden');
                if (txt) txt.textContent = 'Collapse ▴';
                const input = document.getElementById(expandId + '_input');
                if (input) setTimeout(() => input.focus(), 50);
            } else {
                panel.classList.add('hidden');
                if (txt) {
                    const count = panel.querySelectorAll('.widget-followup-pill').length;
                    txt.textContent = `More (+${count}) ▾`;
                }
            }
            lucide.createIcons();
        }

        function filterWidgetFollowup(expandId, query) {
            const grid = document.getElementById(expandId + '_grid');
            const empty = document.getElementById(expandId + '_empty');
            const clearBtn = document.getElementById(expandId + '_clear');
            if (!grid) return;

            const q = (query || '').trim().toLowerCase();
            if (clearBtn) {
                if (q) clearBtn.classList.remove('hidden');
                else clearBtn.classList.add('hidden');
            }

            const pills = grid.querySelectorAll('.widget-followup-pill');
            let visibleCount = 0;
            pills.forEach(p => {
                const topic = p.getAttribute('data-topic') || '';
                if (!q || topic.includes(q)) {
                    p.classList.remove('hidden');
                    visibleCount++;
                } else {
                    p.classList.add('hidden');
                }
            });

            if (empty) {
                if (visibleCount === 0) empty.classList.remove('hidden');
                else empty.classList.add('hidden');
            }
        }

        function clearWidgetFollowupSearch(expandId) {
            const input = document.getElementById(expandId + '_input');
            if (input) {
                input.value = '';
                filterWidgetFollowup(expandId, '');
                input.focus();
            }
        }

        function handleWidgetFollowup(btn, optionText, promptContext) {
            const card = btn.closest('.widget-followup-card') || btn.closest('.space-y-2');
            if (card) {
                const buttons = card.querySelectorAll('button');
                buttons.forEach(b => {
                    if (b.id && (b.id.includes('_toggle_btn') || b.id.includes('_clear'))) {
                        b.disabled = true;
                        return;
                    }
                    b.disabled = true;
                    if (b === btn) {
                        b.className = "px-2.5 py-1 rounded-xl text-[11px] font-bold text-white shadow-xs flex items-center gap-1 cursor-default";
                        b.style.backgroundColor = botConfig ? botConfig.accentColor : '#00c48c';
                    } else {
                        b.className = "px-2.5 py-1 rounded-xl text-[11px] font-medium bg-slate-100 dark:bg-slate-800 text-slate-400 border border-transparent cursor-not-allowed opacity-50 flex items-center gap-1";
                    }
                });
                const panel = card.querySelector('[id$="_panel"]');
                if (panel) panel.classList.add('hidden');
            } else {
                const parentContainer = btn.closest('.flex-wrap');
                if (parentContainer) {
                    const buttons = parentContainer.querySelectorAll('button');
                    buttons.forEach(b => {
                        b.disabled = true;
                        if (b === btn) {
                            b.className = "px-2.5 py-1 rounded-xl text-[11px] font-bold text-white shadow-xs flex items-center gap-1 cursor-default";
                            b.style.backgroundColor = botConfig ? botConfig.accentColor : '#00c48c';
                        } else {
                            b.className = "px-2.5 py-1 rounded-xl text-[11px] font-medium bg-slate-100 dark:bg-slate-800 text-slate-400 border border-transparent cursor-not-allowed opacity-50 flex items-center gap-1";
                        }
                    });
                }
            }

            const lowerOpt = optionText.toLowerCase();
            const isNegative = lowerOpt.includes('no') || lowerOpt.includes('not now') || lowerOpt.includes('skip') || lowerOpt.includes('dismiss') || lowerOpt.includes('ask something else');

            if (isNegative) {
                const wrap = btn.closest('div.space-y-2');
                if (wrap) {
                    const note = document.createElement('div');
                    note.className = "text-[10px] text-slate-400 italic flex items-center gap-1 pt-1";
                    note.innerHTML = '<i data-lucide="check" class="w-3 h-3 text-emerald-500"></i> Understood! What would you like to know? Feel free to ask below.';
                    wrap.appendChild(note);
                    lucide.createIcons();
                }
                const input = document.getElementById('wInput');
                if (input) input.focus();
                return;
            }

            let nextQuery = optionText;
            if (lowerOpt.startsWith('yes') || lowerOpt.startsWith('tell me more') || lowerOpt.includes('show more')) {
                if (promptContext) {
                    let topic = promptContext.replace(/^I also have (?:details|information|information on|details on)\s+/i, '')
                                             .replace(/^(?:what would you like to explore next|here are related areas you might find interesting)\??:?/i, '')
                                             .replace(/\.\s*Would you like to (?:explore|check) that\??/i, '')
                                             .replace(/\?$/, '').trim();
                    nextQuery = topic ? "Tell me more about " + topic : "Tell me more details about that";
                } else {
                    nextQuery = "Tell me more details about that.";
                }
            } else if (!lowerOpt.startsWith('what') && !lowerOpt.startsWith('how') && !lowerOpt.startsWith('tell')) {
                nextQuery = "Tell me about " + optionText;
            }

            const input = document.getElementById('wInput');
            if (input) {
                input.value = nextQuery;
                sendMessage();
            }
        }

        async function submitLead(botId, btn) {
            const parent = btn.parentElement;
            const name = parent.querySelector('#l_name').value;
            const email = parent.querySelector('#l_email').value;
            if(!name && !email) return alert("Please enter your name or email.");
            if (name && name.trim()) {
                localStorage.setItem('kiavi_visitor_name', name.trim());
            }

            const f = new FormData();
            f.append('bot_id', botId);
            f.append('name', name);
            f.append('email', email);
            f.append('note', lastUserQuestion ? `Inquiry: ${lastUserQuestion}` : 'Inquiry via chat widget');
            await fetch('/api/public/lead', { method: 'POST', body: f });
            parent.innerHTML = `<span class="text-emerald-600 dark:text-emerald-400 font-bold text-xs">✓ Thanks, we'll reach out!</span>`;
        }

        window.onload = init;
    </script>
</body>
</html>
