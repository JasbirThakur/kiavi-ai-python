services:
  # 🐘 PostgreSQL Database with Native pgvector Support
  db:
    image: pgvector/pgvector:pg16
    container_name: kiavi_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: kiavidb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ⚡ Kiavi IQ FastAPI Backend Engine
  backend:
    image: kiavi-ai-python-backend:latest
    build:
      context: ./backend
    container_name: kiavi_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword2026@db:5432/kiavidb
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    volumes:
      - ./backend:/app
      - ./frontend/public:/app/public
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # 🌐 Kiavi IQ Dedicated Frontend Service (Reverse Proxy & UI)
  frontend:
    image: kiavi-ai-python-frontend:latest
    build:
      context: ./frontend
    container_name: kiavi_frontend
    restart: always
    depends_on:
      - backend
    volumes:
      - ./frontend/public:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "3000:80"

volumes:
  pgdata:
