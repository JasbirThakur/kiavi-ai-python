# ==============================================================================
# Kiavi IQ Backend - Standalone Docker Compose
# Runs PostgreSQL (pgvector) on port 5433 and FastAPI Backend Engine on port 8000
# Usage on Desktop / Standalone:
#   docker compose up -d
# ==============================================================================
services:
  # 🐘 PostgreSQL Database with Native pgvector Support
  db:
    image: pgvector/pgvector:pg16
    container_name: kiavi_backend_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: kiavidb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ⚡ Kiavi IQ FastAPI Backend Engine
  backend:
    image: kiavi-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kiavi_backend_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword2026@db:5432/kiavidb
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:

