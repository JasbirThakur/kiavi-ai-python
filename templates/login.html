<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiavi IQ - Access System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.15) 0%, transparent 50%),
                radial-gradient(2px 2px at 30px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 120px 100px, #38bdf8, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 200px 220px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 300px 80px, #818cf8, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: auto, 350px 350px, 400px 400px, 300px 300px, 450px 450px;
        }
        .glow-card {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(10, 15, 30, 0.9) 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(37, 99, 235, 0.2);
        }
        .glow-btn {
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #06b6d4 100%);
            box-shadow: 0 0 25px rgba(37, 99, 235, 0.5);
            transition: all 0.3s ease;
        }
        .glow-btn:hover {
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.7);
            transform: scale(1.02);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-xs text-slate-200">

    <div class="glow-card max-w-sm w-full p-8 rounded-3xl space-y-6 text-center relative overflow-hidden">
        
        <!-- GLOWING ICON -->
        <div class="w-12 h-12 mx-auto rounded-2xl bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center text-white shadow-[0_0_25px_rgba(6,182,212,0.6)]">
            <i data-lucide="zap" class="w-6 h-6 fill-white"></i>
        </div>

        <div>
            <h1 class="text-xl font-black text-white tracking-tight">Welcome Back</h1>
            <p class="text-slate-400 text-xs mt-1">Authenticate to access neural agents.</p>
        </div>

        <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4 text-left">
            <div id="nameField" class="hidden">
                <label class="text-[11px] font-bold text-slate-400 block mb-1">Full Name</label>
                <input id="userName" placeholder="Your Name" class="w-full bg-[#060b17] border border-blue-500/30 rounded-xl p-3 text-xs text-white outline-none focus:border-cyan-400 focus:shadow-[0_0_15px_rgba(6,182,212,0.3)] transition" />
            </div>

            <div>
                <label class="text-[11px] font-bold text-slate-400 block mb-1 uppercase tracking-wider">Username / Email</label>
                <input id="userEmail" type="email" required placeholder="admin@appdeft.ai" class="w-full bg-[#060b17] border border-blue-500/30 rounded-xl p-3 text-xs text-white outline-none focus:border-cyan-400 focus:shadow-[0_0_15px_rgba(6,182,212,0.3)] transition" />
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Password</label>
                    <a href="#" class="text-[10px] text-cyan-400 hover:underline">Forgot?</a>
                </div>
                <div class="relative">
                    <input id="userPassword" type="password" required placeholder="••••••••" class="w-full bg-[#060b17] border border-blue-500/30 rounded-xl p-3 text-xs text-white outline-none focus:border-cyan-400 focus:shadow-[0_0_15px_rgba(6,182,212,0.3)] transition" />
                    <button type="button" onclick="togglePassword()" class="absolute right-3 top-3 text-slate-500 hover:text-slate-300">
                        <i data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full glow-btn text-white font-bold py-3.5 rounded-2xl text-xs mt-2">
                Access System
            </button>
        </form>

        <div class="pt-2 border-t border-blue-500/20 text-center">
            <span id="switchPrompt" class="text-slate-400 text-xs">Don't have an account?</span>
            <button onclick="toggleMode()" id="switchBtn" class="text-cyan-400 font-bold hover:underline ml-1">Sign Up</button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let isSignup = false;

        function togglePassword() {
            const pwd = document.getElementById('userPassword');
            pwd.type = pwd.type === 'password' ? 'text' : 'password';
        }

        function toggleMode() {
            isSignup = !isSignup;
            document.getElementById('nameField').classList.toggle('hidden', !isSignup);
            document.getElementById('submitBtn').innerText = isSignup ? 'Create Account' : 'Access System';
            document.getElementById('switchPrompt').innerText = isSignup ? 'Already have an account?' : "Don't have an account?";
            document.getElementById('switchBtn').innerText = isSignup ? 'Sign In' : 'Sign Up';
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('userEmail').value.trim();
            const password = document.getElementById('userPassword').value.trim();
            const name = document.getElementById('userName').value.trim();

            const url = isSignup ? '/api/auth/register' : '/api/auth/login';
            const payload = isSignup ? { name: name || email.split('@')[0], email, password } : { email, password };

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('kiavi_token', data.token);
                    window.location.href = '/dashboard';
                } else {
                    alert("Error: " + (data.detail || "Authentication failed"));
                }
            } catch (err) {
                alert("Server connection failed.");
            }
        }
    </script>
</body>
</html>
